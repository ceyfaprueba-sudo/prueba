<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEYFA - Portal</title>
    <link rel="icon" type="image/x-icon" href="img/favicon-ceyfa.svg">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/portal.css">
</head>

<body>
    <header id="menu-portal" class="menu-secundario fixed-top py-3">
        <div class="container flex-nowrap rounded-pill border shadow-lg px-4 py-2">
            <a class="navbar-brand me-2 me-md-3" href="index.html">
                <img src="img/logo.png" alt="CEYFA">
            </a>
            <div class="d-flex align-items-center gap-2 menu-navbar-nav">
                <span class="menu-nav-link">PORTAL</span>
            </div>
            <div class="ms-2 ms-md-3">
                <a href="index.html" class="btn rounded-pill btn-secondary-custom btn-nav-action text-nowrap">
                    volver <i class="bi bi-box-arrow-in-right ms-2"></i>
                </a>
            </div>
        </div>
    </header>
    <main>
        <!-- BANNER -->
        <section id="banner-portal" class="banner-secundario">
            <div class="banner-overlay">
                <img src="img/portal/banner-portal.jpg" alt="Arqueros CEYFA">
            </div>
            <div class="container">
                <div class="encabezado-section_doble">
                    <div class="encabezado-section">
                        <span class="encabezado-section_antetitulo">// PORTAL</span>
                        <h1 class="encabezado-section_titulo">Agenda <span class="text-gradient">tus clases</span></h1>
                    </div>
                    <div class="encabezado-section_extra">
                        <p class="text-line-left">Sección digital de goleros y comunidad oficial de alta
                            competencia de <strong>CEYFA Uruguay</strong>.</p>
                    </div>
                </div>
            </div>
        </section>
        <!-- PORTAL -->
        <section id="login" class="py-5 my-2">
            <div class="container">
                <div class="row">

                    <div class="col-10 col-sm-8 col-md-6 col-lg-4 mx-auto auth-portal-wrapper">
                        <form id="form-auth-portal"
                            class="card-custom card-form box-custom box-column-custom gap-3 shadow-lg" novalidate>

                            <!-- Campo 01: Usuario Cédula (Llavero inteligente blindado) -->
                            <div class="box-custom box-column-custom input-group-holder w-100">
                                <label for="input-auth-user" class="label-custom">Cédula o Usuario (*)</label>
                                <div class="position-relative input-with-icon-wrapper">
                                    <i class="bi bi-person-badge field-icon-auth"></i>
                                    <input type="text" id="input-auth-user" class="form-control input-custom ps-5"
                                        placeholder="Ej: 12345678" minlength="6" autocomplete="username" required>
                                </div>
                            </div>

                            <!-- Campo 02: Contraseña CamelCase (NombreApellido) -->
                            <div class="box-custom box-column-custom input-group-holder w-100">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="input-auth-pass" class="label-custom m-0">Contraseña (*)</label>
                                    <a href="https://wa.me" target="_blank" rel="noopener noreferrer"
                                        class="forgot-pass-link-shop small">¿La olvidaste?</a>
                                </div>
                                <div class="position-relative input-with-icon-wrapper">
                                    <i class="bi bi-lock-fill field-icon-auth"></i>
                                    <input type="password" id="input-auth-pass" class="form-control input-custom ps-5"
                                        placeholder="••••••••" minlength="4" autocomplete="current-password" required>
                                </div>
                            </div>

                            <button type="submit"
                                class="btn rounded-pill btn-primary-custom w-100 py-2.5 mt-2 btn-submit-auth">
                                Ingresar al Panel <i class="bi bi-box-arrow-in-right ms-2"></i>
                            </button>

                        </form>
                    </div>

                </div>
            </div>
        </section>
        <!-- PIE DE PÁGINA -->
        <footer id="pie-pagina">
            <div class="container">
                <div class="box-row-custom">
                    <div class="box-grid-custom">
                        <img src="img/logo-black.png" alt="CEYFA" class="img-fluid">
                        <div class="box-column-custom">
                            <p>Centro de Entrenamiento y Formación de Arqueros</p>
                            <p class="copyright-text">&copy; 2026 - Todos los derechos reservados.</p>
                        </div>
                    </div>
                    <a href="img/ceyfa.pdf" class="link-doc-custom" target="_blank">
                        <span class="pdf-btn-lbl">Resumen .pdf<i class="bi bi-file-earmark-pdf ms-2"></i></span>
                    </a>
                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script src="js/script.js"></script>
        <script src="js/alumnos.js"></script>
        <script src="js/portal.js"></script>
</body>

</html>
